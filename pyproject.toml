[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotapi"
version = "2.0.0"
description = "Typed async access to Spotify's public catalogue and existing players. No API key."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aran404", url = "https://github.com/Aran404" }]
keywords = [
    "spotify",
    "async",
    "asyncio",
    "api",
    "wrapper",
    "spotify-api",
    "spotify-private-api",
    "no-api-key",
]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "wreq==0.12.0",
]

[project.scripts]
spotapi = "spotapi.cli:main"

[project.optional-dependencies]
studio = ["pywebview>=6.2,<7", "python-dotenv>=1.0"]
demo = [
    "textual>=8.2,<9",
    "textual-image>=0.12,<0.13; python_version < '3.12'",
    "textual-image>=0.14,<0.15; python_version >= '3.12'",
    "pillow>=11,<14",
    "httpx>=0.28,<0.29",
]
dev = [
    "black>=24.0",
    "coverage>=7.6",
    "pyright>=1.1",
    "python-dotenv>=1.0",
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "playwright>=1.55,<2",
]

[project.urls]
Homepage     = "https://github.com/Aran404/SpotAPI"
Repository   = "https://github.com/Aran404/SpotAPI"
"Bug Tracker" = "https://github.com/Aran404/SpotAPI/issues"
Changelog    = "https://github.com/Aran404/SpotAPI/blob/main/CHANGELOG.md"

[tool.hatch.build]
exclude = ["spotapi/*.zip"]

[tool.hatch.build.targets.wheel]
packages = ["spotapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "authenticated: tests requiring SPOTIFY_COOKIE",
    "mutates: live checks that change playback or account data",
    "live: real Spotify requests enabled with --live",
]

# ---------------------------------------------------------------------------
# Linting (Ruff)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.coverage.run]
branch = true
source = ["spotapi"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID", "RUF022", "RUF100"]
ignore  = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spotapi"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Type Checking (Pyright)
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["spotapi", "examples", "tests", "benchmarks"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
executionEnvironments = [{ root = "tests", extraPaths = ["."], reportPrivateUsage = false }]
