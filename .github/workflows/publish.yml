name: Release preflight and PyPI publish

# PRs and main use the SAME build/test environment as tagged releases.
# Only a version-tag push is allowed to upload to PyPI.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Release preflight (publish environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag and package versions differ"
          PY
      - run: python -m pip install build twine
      - run: python -m pip install -e '.[dev,demo]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m 'not live' -q
      - run: python -m pyright
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test the installed wheel outside the checkout
        working-directory: /tmp
        run: |
          spotapi --help
          spotapi discover --help
          spotapi studio --help
          python -I - <<'PY'
          import os
          from importlib.util import find_spec
          from pathlib import Path
          import spotapi
          from spotapi import Private, Public
          from spotapi.models import PlaylistTrack
          assert not Path(spotapi.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          assert find_spec("spotapi.v2") is None
          assert callable(Private.from_cookies)
          assert find_spec("spotapi._demo.discover") is not None
          assert find_spec("spotapi._demo.details") is not None
          from spotapi._studio.desktop import page
          assert "STUDIO_SCRIPT" not in page()
          from importlib.resources import files
          for asset in ("logo.svg", "logo.png", "logo.ico"):
              assert files("spotapi._studio").joinpath("assets", asset).is_file()
          assert Public.parse_url("spotify:track:abc").id == "abc"
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/

  publish:
    # Never publish from a PR, main-branch push, or manual dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
